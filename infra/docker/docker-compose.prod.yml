# Production-ish docker-compose for a single-VPS deployment.
# postgres + api + caddy on one host, internal network for db/api,
# caddy exposes 80/443 to the world.
#
# Usage:
#   cp .env.example .env       # then fill in real secrets
#   docker compose -f infra/docker/docker-compose.prod.yml up -d
#
# On first boot, run the migration:
#   docker compose -f infra/docker/docker-compose.prod.yml exec api \
#     pnpm --filter @evidence/api db:migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: evidence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evidence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-evidence}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evidence} -d ${POSTGRES_DB:-evidence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: evidence-api:latest
    container_name: evidence-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-evidence}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evidence}
      API_PORT: 3000
      API_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?WEBHOOK_HMAC_SECRET is required}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /app/.evidence-store
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_KMS_KEY_ID: ${STORAGE_KMS_KEY_ID:-}
      RETAIN_MODE: ${RETAIN_MODE:-governance}
      RETAIN_YEARS: ${RETAIN_YEARS:-5}
      TSA_DEFAULT_PROVIDER: ${TSA_DEFAULT_PROVIDER:-mock}
      TSA_BR_PROVIDER: ${TSA_BR_PROVIDER:-mock}
      TSA_EU_PROVIDER: ${TSA_EU_PROVIDER:-mock}
      TSA_US_PROVIDER: ${TSA_US_PROVIDER:-mock}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://docas.ai}
      # Required: the stack refuses to start on the insecure default so the
      # admin JWT can never be signed with a publicly-known secret in prod.
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-60}
      PUBLIC_RATE_LIMIT_WINDOW: ${PUBLIC_RATE_LIMIT_WINDOW:-1 minute}
    volumes:
      - evidence-store:/app/.evidence-store
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: evidence-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      # CADDYFILE selects plain-HTTP (./Caddyfile, default) or TLS-with-origin-cert
      # (./Caddyfile.tls) without editing the compose file.
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      # CERTS_DIR holds origin.crt + origin.key for the TLS Caddyfile. Defaults
      # to the (empty) ./certs dir so the mount is valid even in plain-HTTP mode.
      - ${CERTS_DIR:-./certs}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  evidence-store:
  caddy-data:
  caddy-config:
