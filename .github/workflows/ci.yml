name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evidence
          POSTGRES_PASSWORD: evidence
          POSTGRES_DB: evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidence -d evidence"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://evidence:evidence@localhost:5432/evidence
      TEST_DATABASE_URL: postgres://evidence:evidence@localhost:5432/evidence

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Run tests
        run: pnpm test
